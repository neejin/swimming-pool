name: Fetch US 10Y Decomposition (ACM + DFII10)

on:
  workflow_dispatch:   # 수동 실행 전용 (Actions 탭 → Run workflow)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl xlrd

      - name: Fetch ACM + DFII10 and build xlsx
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_term_premia.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us10y_decomposition.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update US 10Y decomposition $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
